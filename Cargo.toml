[package]
name = "securepipe"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gateway"
path = "src/main.rs"

[[bin]]
name = "simulator"
path = "src/simulator.rs"

[lib]
name = "securepipe"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }

ring = "0.17"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"

futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }